name: Deploy Static Content
on:
  push:
    branches: ["main"] # Chạy khi bạn push code lên branch main
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # THAY ĐỔI Ở ĐÂY: Đường dẫn đến folder chứa file index.html của bạn
          path: './dashboard' 
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4