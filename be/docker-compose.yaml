x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3
  environment:
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres-airflow/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW_CONN_CREDIT_CONTROL_POSTGRES: postgresql+psycopg2://admin:123456@postgres-credit:5432/credit_control
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    redis:
      condition: service_healthy
    postgres-airflow:
      condition: service_healthy
  networks:
    - data-platform-network

x-python-app-build: &python-app-build
  build:
    context: .
    dockerfile: Dockerfile

services:
  postgres-credit:
    image: pgvector/pgvector:pg16
    container_name: postgres-credit
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: credit_control
    ports:
      - "5432:5432"
    volumes:
      - postgres-credit-data:/var/lib/postgresql/data
      # Nếu muốn tự init schema/seed khi volume mới, bỏ comment dòng dưới:
      # - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d credit_control"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - data-platform-network

  postgres-airflow:
    image: pgvector/pgvector:pg13
    container_name: postgres-airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - data-platform-network

  redis:
    image: redis:7.2-bookworm
    container_name: redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - data-platform-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - data-platform-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9093 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - data-platform-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093
    networks:
      - data-platform-network

  kafka-consumer:
    <<: *python-app-build
    container_name: kafka-pg-consumer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      PG_HOST: postgres-credit
      PG_PORT: 5432
      PG_DB: credit_control
      PG_USER: admin
      PG_PASSWORD: 123456
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PYTHONPATH: /app/kafka
    working_dir: /app/kafka
    depends_on:
      kafka:
        condition: service_healthy
      postgres-credit:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - data-platform-network
    command: ["python", "-m", "consumers.pg_batch_consumer", "--batch-size", "200", "--timeout", "5000"]
    restart: unless-stopped

  kafka-simulator:
    <<: *python-app-build
    container_name: kafka-simulator
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      PG_HOST: postgres-credit
      PG_PORT: 5432
      PG_DB: credit_control
      PG_USER: admin
      PG_PASSWORD: 123456
      PYTHONPATH: /app/kafka
      SIM_TZ: Asia/Ho_Chi_Minh
      DISBURSE_DELAY_MIN: "2"
      DISBURSE_DELAY_MAX: "30"
    working_dir: /app/kafka
    depends_on:
      kafka:
        condition: service_healthy
      postgres-credit:
        condition: service_healthy
      kafka-consumer:
        condition: service_started
    networks:
      - data-platform-network
    command:
      [
        "python", "-m", "simulator.main",
        "--mode", "realtime",
        "--stores", "800",
        "--daily-min", "1000",
        "--daily-max", "3000",
        "--hourly-min", "20",
        "--hourly-max", "120",
        "--payment-ratio", "0.55",
        "--interval", "1",
        "--sim-minutes-per-tick", "1"
      ]
    restart: unless-stopped

  fastapi:
    <<: *python-app-build
    container_name: fastapi-realtime
    environment:
      PG_HOST: postgres-credit
      PG_PORT: 5432
      PG_DB: credit_control
      PG_USER: admin
      PG_PASSWORD: 123456
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PYTHONPATH: /app/fastapi
    ports:
      - "8000:8000"
    working_dir: /app/fastapi
    volumes:
      - ./fastapi:/app/fastapi
    depends_on:
      postgres-credit:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-consumer:
        condition: service_started
    networks:
      - data-platform-network
    command: ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  dashboard:
    image: nginx:1.27-alpine
    container_name: f88-dashboard
    ports:
      - "5500:80"
    volumes:
      - ../dashboard:/usr/share/nginx/html:ro
    depends_on:
      fastapi:
        condition: service_started
    networks:
      - data-platform-network
    restart: unless-stopped

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    container_name: airflow-worker
    command: celery worker
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    container_name: airflow-triggerer
    command: triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate && \
        airflow users create \
          --username airflow \
          --password airflow \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
    depends_on:
      redis:
        condition: service_healthy
      postgres-airflow:
        condition: service_healthy

networks:
  data-platform-network:
    name: data-platform-network
    driver: bridge

volumes:
  postgres-credit-data:
  postgres-airflow-data:
