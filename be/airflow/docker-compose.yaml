x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3
  environment:
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres-airflow/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW_CONN_CREDIT_CONTROL_POSTGRES: postgresql+psycopg2://admin:123456@postgres-credit:5432/credit_control
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  networks:
    - data-platform-network

services:
  postgres-airflow:
    image: pgvector/pgvector:pg13  # <-- Đã trả lại đúng bản cũ bạn có sẵn
    container_name: postgres-airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
    networks:
      - data-platform-network

  postgres-credit:
    image: pgvector/pgvector:pg16  # <-- Đã trả lại đúng bản cũ bạn có sẵn
    container_name: postgres-credit
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: credit_control
    ports:
      - "5432:5432"
    networks:
      - data-platform-network

  redis:
    image: redis:7.2-bookworm  # <-- Đã trả lại đúng bản cũ bạn có sẵn
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
    networks:
      - data-platform-network

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init: { condition: service_completed_successfully }

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init: { condition: service_completed_successfully }

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - "airflow db migrate && airflow users create --username airflow --password airflow --firstname Admin --lastname User --role Admin --email admin@example.com"